# Multi-user game server panel
version: "3.9"
services:
  panel:
    build: ../panel
    ports:
      - "3000:3000"
    environment:
      AETHER_PANEL_PORT: "3000"
    volumes:
      - panel-data:/data
    restart: unless-stopped

  daemon:
    build: ../daemon
    pid: host
    ports:
      - "8080:8080"
    environment:
      AETHER_TOKEN: "CHANGE_ME"
      AETHER_PORT: "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - daemon-data:/root/.config
    restart: unless-stopped

volumes:
  panel-data:
  daemon-data:
