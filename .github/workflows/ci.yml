name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    name: Go daemon build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        working-directory: daemon
        run: go build -v ./...

  panel:
    name: TS panel build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm run build

  client:
    name: React client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/client/package-lock.json
      - run: npm ci
      - run: npm run build
